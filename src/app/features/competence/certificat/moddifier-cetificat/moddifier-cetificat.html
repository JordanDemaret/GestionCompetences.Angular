<form [formGroup]="form">

    <div  class="form-group-col">
        <label for="nomCertificat">Nom du Certificat</label>
        <input pInputText id="nomCertificat" formControlName="nomCertificat">
    </div>

    <div  class="form-group-col">
        <label for="codeCertificat">Code du Certificat</label>
        <input pInputText id="codeCertificat" formControlName="codeCertificat">
    </div>
    
    <div  class="form-group-col">
        <label for="editeur">Éditeur</label>
        <input pInputText id="editeur" formControlName="editeur">
    </div>

    <div  class="form-group-col"> 
        <label for="dateObtention">Date d'obtention</label>
        <p-date-picker id="dateObtention"   appendTo="body"
            formControlName="dateObtention" dateFormat="dd/mm/yy"></p-date-picker>
    </div>


    <div  class="form-group-col">
        <p-button label="Enregistrer" severity="success" (onClick)="onSave()"/>

        <p-button label="Annuler" severity="secondary" (onClick)="onCancel()"/>
    </div>

</form>
