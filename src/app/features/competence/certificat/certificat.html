<p-button (onClick)="ouvrirAjout()" >
    Ajouter des compétence
</p-button>

<p-table [value]="certificatListe()">
    
    <ng-template #header>
        <tr>
            <th>Nom</th>
            <th>Code</th>
            <th>Editeur</th>
            <th>Date D'obtention"</th>
            <th>Nombre de Compétence liée</th>
        </tr>
    </ng-template >

    <ng-template #body let-cer>
        <tr>
            <td>{{cer.nomCertificat}}</td>
            <td>{{cer.codeCertificat}}</td>
            <td>{{cer.editeur}}</td>
            <td>{{cer.dateObtention | date : 'dd/MM/yyyy'}}</td>
            <td>{{cer.nombreDeCompetencesLiees}}</td>
            
        </tr>
    </ng-template>

</p-table> 

<p-dialog    
    [visible]="ajouterCertif"
    header="Ajouter un compétence :"
    [modal]="true"
    [draggable]="false"
    [style]="{ width: '40rem' }"
    (onHide)="ajouterCertif=false;">
    <app-ajouter-cetificat
        (sauvegarder)="ajouterCertificat($event)"
        (annuler)="ajouterCertif=false"
    />
</p-dialog>
