<form [formGroup]="form" >

    <div class="flex align-items-center gap-3">
        <label for="id" class="font-bold w-12rem">ID</label>
        <input 
            pInputText 
            id="id" 
            [value]="categorie()?.id" 
            [disabled]="true" 
            class="flex-1" 
        />
    </div>

    <div class="flex align-items-center gap-3">
        <label for="Nom" class="font-bold w-12rem">Nom de la catégorie</label>
        <div class="flex-1 flex flex-column gap-1">
            <input 
                pInputText 
                id="Nom" 
                placeholder="Entrez le nom" 
                formControlName="Nom" 
                class="w-full" 
            />
            
            @if (form.get('Nom')?.touched && form.get('Nom')?.errors?.['required']) {
                <small class="text-red-500">Le nom est obligatoire.</small>
            }
            @if (form.get('Nom')?.errors?.['doublon']) {
                <small class="text-red-500">Une catégorie avec ce nom existe déjà.</small>
            }
        </div>
    </div>

    <div class="flex justify-content-end gap-2 mt-2">
        <p-button label="Annuler" severity="secondary" (onClick)="onCancel()" />
        <p-button label="Enregistrer" severity="success" (onClick)="onSave()" />
    </div>

</form>
