<form [formGroup]="form">
    
    <div>
        <label for="Nom">Nom </label>
        <input pInputText id="Nom" formControlName="nom">
    </div>

    <div>
        <label for="Note">Note </label>
        <input pInputText id="Note" formControlName="note">
    </div>
    
    
    <div>
        <label for="Date">Date de début </label>
        <p-date-picker id="Date" formControlName="dateDeDebut" dateFormat="dd/mm/yy"></p-date-picker>
    </div>

    <div>
        <label for="visibilité">Visibilité </label>
        <p-select id="visibilité" [options]="visibiliteOption" 
           optionValue="value" optionLabel="label"
           formControlName="visibilite"></p-select>
    </div>
    <div> 
        <label for="Statue">Statut </label>
        <p-select id="Statut" [options]="statutOptions" 
           optionValue="value" optionLabel="label"
           formControlName="statut"></p-select>
    </div>

    <div> 
        <label for="categorie">Categorie </label>
        <p-select id="categorie" [options]="categorieList()" 
           optionValue="id" optionLabel="nom"
           formControlName="categorieId"></p-select>
    </div>

    <div> 
        <label for="Niveau">Niveau </label>
        <p-select id="Niveau" [options]="niveauList()" 
           optionValue="id" optionLabel="label"
           formControlName="niveauId"></p-select>
    </div>


    <div>
        <p-button label="Annuler" severity="secondary" (onClick)="onCancel()"/>
        <p-button label="Enregistrer" severity="success" (onClick)="onSave()"/>
    </div>


</form>
